
<section class="login-container">
<h1>Crear cuenta</h1>

 <p>Ingresar los datos para hacer el registro</p>



<form [formGroup]="FormData" (ngSubmit)="onSubmit()">

<div class="form-group">
    <label for="name">Nombre</label>
    <input type="name" formControlName="name" id="name" placeholder="Ingresa tu nombre">
</div>

<div class="form-group">
    <label for="lastname">Apellido</label>
    <input type="lastname" formControlName="lastname" id="lastname" placeholder="Ingresa tu apellido">
</div>

<div class="form-group">
    <label for="email">Correo Electrónico</label>
    <input type="email" formControlName="email" id="email" placeholder="Ingresa tu correo">
</div>

<div class="form-group" >
    <label for="password">Contraseña</label>
    <input type="password" formControlName="password" id="password" placeholder="Ingresa tu contraseña">
</div>

<div class="form-group" >
    <label for="password">Confirmar contraseña</label>
    <input type="password" formControlName="password" id="password" placeholder="Ingresa nuevamente tu contraseña">
</div>

<button type="submit" >Registrar</button>

</form>
</section>

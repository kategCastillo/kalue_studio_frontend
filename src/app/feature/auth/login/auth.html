
<section class="login-container">
<h1>Bienvenido a Kalué</h1>

 <p>Ingresar los datos para ingresar a la cuenta </p>

<h2>Iniciar sesión</h2>

<form  [formGroup]="FormData" (ngSubmit)="onSubmit()">

<div class="form-group">
    <label for="email">Correo Electrónico</label>
    <input type="email" formControlName="user" id="email" placeholder="Ingresa tu correo">
</div>

<div class="form-group" >
    <label for="password">Contraseña</label>
    <input type="password" formControlName="password" id="password" placeholder="Ingresa tu contraseña">
</div>

<button type="submit" >Iniciar sesión</button>

</form>
</section>

<aside class="sidebar" [class.sidebar--open]="isMobileOpen()">

  <!-- Barra superior (solo visible en móvil/tablet) -->
  <div class="sidebar__mobile-bar">
    <span class="sidebar__mobile-brand">Kalue Studio · Admin</span>
    <button
      class="sidebar__mobile-toggle"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileOpen()"
      aria-label="Abrir menú de administración"
    >
      <svg *ngIf="!isMobileOpen()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <svg *ngIf="isMobileOpen()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>
  </div>

  <div class="sidebar__inner sidebar__collapsible">

    <!-- Marca -->
    <div class="sidebar__brand">
      <span class="sidebar__brand-label">Kalue Studio</span>
      <h2 class="sidebar__brand-title">Panel de<br />Administración</h2>
    </div>

    <div class="sidebar__divider"></div>

    <!-- Navegación principal -->
    <nav class="sidebar__nav" (click)="closeMobileMenu()">
      <a
        class="sidebar__nav-item"
        routerLink="/dashboard/resume"
        routerLinkActive="sidebar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <svg class="sidebar__nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 11.5 12 4l9 7.5" />
          <path d="M5.5 10v9a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1v-9" />
        </svg>
        <span>Resumen</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/dashboard/user/list"
        routerLinkActive="sidebar__nav-item--active"
      >
        <svg class="sidebar__nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="9" cy="8" r="3.2" />
          <path d="M2.8 19c.6-3 3-5 6.2-5s5.6 2 6.2 5" />
          <path d="M15.5 5.2c1.4.4 2.4 1.6 2.4 3.1 0 1.5-1 2.7-2.4 3.1" />
          <path d="M15 14c2.7.4 4.7 2.2 5.2 5" />
        </svg>
        <span>Usuarios</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/dashboard/category/list"
        routerLinkActive="sidebar__nav-item--active"
      >
        <svg class="sidebar__nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 4h8l2 2h8v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4Z" />
          <circle cx="9" cy="13" r="1.3" fill="currentColor" stroke="none" />
        </svg>
        <span>Categorías</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/dashboard/material/list"
        routerLinkActive="sidebar__nav-item--active"
      >
        <svg class="sidebar__nav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z" />
          <path d="M4 7.5 12 12l8-4.5" />
          <path d="M12 12v9" />
        </svg>
        <span>Materiales</span>
      </a>

      <a
        class="sidebar__nav-item"
        routerLink="/dashboard/product/list"
        routerLinkActive="sidebar__nav-item--active"
      >
        <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="14" rx="1.2" />
            <path d="M224 0l0 64c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-64 32 0c35.3 0 64 28.7 64 64l0 128c0 5.5-.7 10.9-2 16l-252 0c-1.3-5.1-2-10.5-2-16l0-128c0-35.3 28.7-64 64-64l32 0zm96 512c-11.2 0-21.8-2.9-31-8 9.5-16.5 15-35.6 15-56l0-128c0-20.4-5.5-39.5-15-56 9.2-5.1 19.7-8 31-8l32 0 0 64c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-64 32 0c35.3 0 64 28.7 64 64l0 128c0 35.3-28.7 64-64 64l-128 0zM0 320c0-35.3 28.7-64 64-64l32 0 0 64c0 8.8 7.2 16 16 16l32 0c8.8 0 16-7.2 16-16l0-64 32 0c35.3 0 64 28.7 64 64l0 128c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 320z"/>
          </svg>
        <span>Productos</span>
      </a>
    </nav>

    <div class="sidebar__spacer"></div>

    <div class="sidebar__divider"></div>

    <!-- Usuario / sesión -->
    <div class="sidebar__footer" (click)="closeMobileMenu()">
      @if (httpAuth.isLoggedIn() && httpAuth.user; as user) {
        <div class="sidebar__user">
          @if (user.avatar) {
            <img [src]="user.avatar" [alt]="user.name || 'Usuario'" class="sidebar__user-avatar" />
          } @else {
            <span class="sidebar__user-avatar sidebar__user-avatar--placeholder">
              {{ (user.name || 'U').charAt(0) }}
            </span>
          }
          <div class="sidebar__user-info">
            <span class="sidebar__user-name">{{ user.name }}</span>
            <span class="sidebar__user-role">{{ user.role }}</span>
          </div>
        </div>

        <button class="sidebar__logout" type="button" (click)="logout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4" />
            <path d="M10 8l-4 4 4 4" />
            <path d="M14 12H3" />
          </svg>
          Cerrar sesión
        </button>
      }

      <a class="sidebar__back-link" routerLink="/">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M19 12H5" />
          <path d="m11 18-6-6 6-6" />
        </svg>
        Volver a la tienda
      </a>
    </div>
  </div>
</aside>

<div class="container">
    <h2 class="title">Registro de usuario</h2>
    <p class="text">Diligencia los campos asignados</p>

  <form [formGroup]="formData" (ngSubmit)="onSend()" class="form">
    <label  class="field label" for="name">Nombre</label>
    <input class="field inpt" type="text" formControlName="name" id="name" placeholder="Pepito Perez"/>
    
    <label  class="field label" for="nickname">Nick Name</label>
    <input class="field inpt" type="text" formControlName="nickname" id="nickname" placeholder="pepitoPejemplo1652"/>

    <label  class="field label" for="email">Correo</label>
    <input class="field inpt" type="email" formControlName="email" id="email" placeholder="ejemplo@ejemplo.com"/>

    <label  class="field label" for="password">Contraseña</label>
    <input class="field inpt" type="password" formControlName="password" id="password" placeholder="eje*****"/>

    <label  class="field label" for="role">Rol</label>
    <select class="field" formControlName="role" id="role">
        <option value="administrator">administrator</option>
        <option value="editor">editor</option>
        <option value="author">author</option>
        <option value="contributor">contributor</option>
        <option value="subscriber">subscriber</option>
    </select>

    <div class="check">
        <input class="rad" [value]="true" formControlName="status" type="radio" id="active" />
        <label  class="label" for="active">Activo</label>
        
        <input class="rad" [value]="false" formControlName="status" type="radio" id="no-active" />
        <label  class="label" for="no-active">No Activo</label>
    </div>

    <label  class="field label" for="link">avatar</label>
    <input class="field inpt" type="text" formControlName="avatar" id="link" />

    <button>Registrar</button>
  </form>
</div>
